name: Deploy Serverless App to AWS

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-2

      - name: Update Lambda Backend Code
        run: |
          zip lambda_payload.zip lambda_function.py
          aws lambda update-function-code \
            --function-name Capstone_code \
            --zip-file fileb://lambda_payload.zip \
            --region ap-south-2

      - name: Deploy Frontend to S3
        run: |
          aws s3 sync ./frontend s3://serverless-task-manager-frontend-rakesh --region ap-south-2